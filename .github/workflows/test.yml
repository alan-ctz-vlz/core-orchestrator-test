name: Check CoreOrchestrator
on: [push]

jobs:
  health-check:
    runs-on: self-hosted
    steps:
      - name: 1. Clonar código en el Runner
        uses: actions/checkout@v4

      - name: 2. Sincronizar archivos al SSD de la Raspberry
        run: |
          echo "--- Iniciando Sincronización ---"
          # Copiamos todo lo clonado a la carpeta /data (que es tu SSD)
          cp -r . /data/
          # Creamos un rastro para confirmar la hora del despliegue
          echo "Sincronización exitosa el: $(date)" > /data/log_despliegue.txt
          echo "Archivos actualmente en el SSD (~/proyectos/core-orchestrator/app):"
          ls -la /data

      - name: 3. Construir y Ejecutar el Contenedor
        run: |
          cd /data
          echo "Borrando versiones anteriores..."
          docker stop core-app || true
          docker rm core-app || true
          
          echo "Construyendo la nueva imagen..."
          docker build -t core-orchestrator-img .
          
          echo "Lanzando el contenedor en segundo plano..."
          docker run -d --name core-app core-orchestrator-img
